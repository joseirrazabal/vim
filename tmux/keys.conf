# Como dividir la pantalla de forma mas intuitiva
# | en vez de %
bind | split-window -h -c "#{pane_current_path}"
# - en vez de "
bind - split-window -v -c "#{pane_current_path}"

# Cambiando el el atajo para entrar al modo copy.
bind-key -n C-e copy-mode

bind-key -T copy-mode-vi 'v' send-keys -X begin-selection
bind-key -T copy-mode-vi 'V' send-keys -X rectangle-toggle
bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel 'xclip -in -selection clipboard'

# ctrl-p paste from clipboard
bind-key -n C-v run "xclip -o -selection c | tmux load-buffer - ; tmux paste-buffer"

# para cambiar de panel alt + [hjkl]
is_nav_app="ps -o state= -o comm= -t '#{pane_tty}' \
    | grep -iqE '^[^TXZ ]+ +(\\S+\\/)?g?(view|n?vim?x?)(diff)?$'"
bind-key -n M-h if-shell "$is_nav_app" "send-keys M-h"  "select-pane -L"
bind-key -n M-j if-shell "$is_nav_app" "send-keys M-j"  "select-pane -D"
bind-key -n M-k if-shell "$is_nav_app" "send-keys M-k"  "select-pane -U"
bind-key -n M-l if-shell "$is_nav_app" "send-keys M-l"  "select-pane -R"
# bind-key -n M-\\ if-shell "$is_nav_app" "send-keys M-\\" "select-pane -l"

# Presiona Ctrl + a + ctrl [jkhl]
# para redimensionar panel
bind-key C-j resize-pane -D 2
bind-key C-k resize-pane -U 2
bind-key C-h resize-pane -L 4
bind-key C-l resize-pane -R 4

# recargar configuracion
unbind r
bind r source-file ~/.tmux.conf \; display "Reloaded tmux.conf"

# toggle mouse on/off
set -g mouse off
bind m set -g mouse

bind -n WheelUpPane   select-pane -t= \; copy-mode -e \; send-keys -M 
bind -n WheelDownPane select-pane -t= \;                 send-keys -M 
